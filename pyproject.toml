
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customerinsight-ai"
version = "0.1.0"
description = "Research-oriented customer behaviour discovery"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "plotly>=6,<7",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.66,<2",
]
dev = [
    "pytest>=8,<10",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "matplotlib>=3.9,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.poetry]
packages = [{ include = "customerinsight", from = "src" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
